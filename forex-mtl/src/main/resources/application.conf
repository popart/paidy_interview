app {
  http {
    host = "0.0.0.0"
    port = 8081
    timeout = 40 seconds
  }
  one-frame {
      host = "localhost"
      port = 8080
      token = ${ONE_FRAME_TOKEN}
      refresh-interval = 2 minutes
      ttl = 4 minutes
      request-timeout = 5 seconds
      retry-delay = 30 seconds
  }
}

